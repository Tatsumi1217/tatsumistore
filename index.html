<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatsumi Store</title>
<style>
  :root{
    --blue:#0071dc; --blue-dark:#005bb5; --yellow:#ffc220;
    --bg:#f2f4f7; --card:#ffffff; --text:#1a1a1a; --muted:#5a6470;
    --border:#e2e6ea; --shadow:0 2px 8px rgba(0,0,0,.08);
  }
  [data-theme="dark"]{
    --bg:#14181d; --card:#1e242b; --text:#f0f2f5; --muted:#9aa4ae;
    --border:#2c333b; --shadow:0 2px 8px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh}
  header{background:var(--blue); color:#fff; padding:14px 20px; position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap}
  header h1{font-size:1.5rem; letter-spacing:.5px; white-space:nowrap}
  header h1 span{color:var(--yellow)}
  .search{flex:1; min-width:180px; max-width:520px; display:flex}
  .search input{flex:1; padding:10px 14px; border:none; border-radius:20px 0 0 20px; font-size:1rem; outline:none}
  .search button{padding:10px 18px; border:none; border-radius:0 20px 20px 0; background:var(--yellow);
    font-weight:700; cursor:pointer}
  .icon-btn{background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:50%;
    width:42px; height:42px; font-size:1.2rem; cursor:pointer; position:relative; flex-shrink:0}
  .icon-btn:hover{background:rgba(255,255,255,.28)}
  #cartCount{position:absolute; top:-4px; right:-4px; background:var(--yellow); color:#1a1a1a;
    font-size:.72rem; font-weight:800; border-radius:50%; min-width:20px; height:20px;
    display:flex; align-items:center; justify-content:center; padding:0 5px}
  nav.cats{background:var(--card); border-bottom:1px solid var(--border); padding:10px 20px;
    display:flex; gap:8px; overflow-x:auto; position:sticky; top:70px; z-index:40}
  nav.cats button{border:1px solid var(--border); background:var(--bg); color:var(--text);
    padding:8px 18px; border-radius:20px; cursor:pointer; white-space:nowrap; font-size:.95rem}
  nav.cats button.active{background:var(--blue); color:#fff; border-color:var(--blue); font-weight:700}
  main{max-width:1200px; margin:0 auto; padding:24px 20px 80px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:18px}
  .card{background:var(--card); border:1px solid var(--border); border-radius:12px; overflow:hidden;
    box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .card .img{background:linear-gradient(135deg,#e8f1fb,#f7fafd); display:flex; align-items:center;
    justify-content:center; padding:22px; min-height:170px}
  [data-theme="dark"] .card .img{background:linear-gradient(135deg,#232b34,#2b333d)}
  .card .img svg{width:110px; height:110px}
  .card .body{padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1}
  .card .cat{font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.6px}
  .card h3{font-size:1.02rem; line-height:1.3}
  .price{font-size:1.35rem; font-weight:800; color:var(--blue)}
  .price small{font-size:.8rem; font-weight:400; color:var(--muted)}
  .qty{display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:10px}
  .qty button{width:32px; height:32px; border-radius:50%; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:1.15rem; cursor:pointer; line-height:1}
  .qty button:hover{background:var(--blue); color:#fff; border-color:var(--blue)}
  .qty span{min-width:28px; text-align:center; font-weight:700}
  .add{margin-top:10px; padding:10px; border:none; border-radius:8px; background:var(--yellow);
    font-weight:800; cursor:pointer; font-size:.95rem}
  .add:hover{filter:brightness(.95)}
  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:60px 20px; font-size:1.1rem}
  /* cart drawer */
  #overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:90}
  #overlay.show{display:block}
  #drawer{position:fixed; top:0; right:-380px; width:min(360px,92vw); height:100vh; background:var(--card);
    z-index:100; transition:right .25s ease; display:flex; flex-direction:column; border-left:1px solid var(--border)}
  #drawer.open{right:0}
  #drawer header{background:var(--blue); color:#fff; padding:16px 18px; display:flex;
    justify-content:space-between; align-items:center; position:static}
  #drawer header h2{font-size:1.2rem}
  #closeCart{background:none; border:none; color:#fff; font-size:1.4rem; cursor:pointer}
  #cartItems{flex:1; overflow-y:auto; padding:14px 18px; display:flex; flex-direction:column; gap:12px}
  .ci{display:flex; gap:12px; align-items:center; border-bottom:1px solid var(--border); padding-bottom:12px}
  .ci .thumb{width:52px; height:52px; border-radius:8px; background:var(--bg); display:flex;
    align-items:center; justify-content:center; flex-shrink:0}
  .ci .thumb svg{width:36px; height:36px}
  .ci .info{flex:1}
  .ci .info b{font-size:.92rem; display:block}
  .ci .info span{color:var(--muted); font-size:.82rem}
  .ci .row{display:flex; align-items:center; gap:8px; margin-top:6px}
  .ci .row button{width:26px; height:26px; border-radius:50%; border:1px solid var(--border);
    background:var(--bg); color:var(--text); cursor:pointer}
  .ci .amt{font-weight:800; white-space:nowrap}
  #cartFoot{padding:16px 18px; border-top:1px solid var(--border)}
  #subtotal{display:flex; justify-content:space-between; font-size:1.15rem; font-weight:800; margin-bottom:12px}
  #checkout{width:100%; padding:13px; border:none; border-radius:10px; background:var(--blue); color:#fff;
    font-size:1.05rem; font-weight:800; cursor:pointer}
  #checkout:hover{background:var(--blue-dark)}
  #note{font-size:.8rem; color:var(--muted); text-align:center; margin-top:8px}
  footer{text-align:center; color:var(--muted); padding:24px; font-size:.85rem}
  @media(max-width:560px){ header h1{font-size:1.2rem} nav.cats{top:64px} }
</style>
</head>
<body>
<header>
  <h1>ð <span>Tatsumi</span> Store</h1>
  <div class="search">
    <input id="search" type="text" placeholder="Search groceriesâ¦" aria-label="Search products">
    <button onclick="applySearch()">Go</button>
  </div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark">â</button>
  <button class="icon-btn" onclick="openCart()" title="Open basket">ð§º<span id="cartCount">0</span></button>
</header>
<nav class="cats" id="cats"></nav>
<main><div class="grid" id="grid"></div></main>

<div id="overlay" onclick="closeCart()"></div>
<aside id="drawer" aria-label="Shopping basket">
  <header><h2>Your Basket</h2><button id="closeCart" onclick="closeCart()">â</button></header>
  <div id="cartItems"></div>
  <div id="cartFoot">
    <div id="subtotal"><span>Subtotal</span><span id="subAmt">$0.00</span></div>
    <button id="checkout" onclick="checkout()">Checkout</button>
    <div id="note">Demo store â connect a payment provider to take real orders.</div>
  </div>
</aside>
<footer>Tatsumi Store â demo storefront. Sample prices for illustration.</footer>
<script>
/* ---------- product art (inline SVG, no external files needed) ---------- */
const ART = {
milk:`<svg viewBox="0 0 100 100"><rect x="30" y="25" width="40" height="60" rx="4" fill="#3b82c4"/><polygon points="30,25 42,10 58,10 70,25" fill="#2f6da8"/><rect x="30" y="45" width="40" height="22" fill="#fff"/><text x="50" y="61" font-size="13" text-anchor="middle" fill="#3b82c4" font-weight="bold">MILK</text></svg>`,
eggs:`<svg viewBox="0 0 100 100"><ellipse cx="35" cy="55" rx="14" ry="18" fill="#f5e9d0" stroke="#d9c49a"/><ellipse cx="65" cy="55" rx="14" ry="18" fill="#f5e9d0" stroke="#d9c49a"/><ellipse cx="50" cy="38" rx="13" ry="17" fill="#faf3e3" stroke="#d9c49a"/><rect x="22" y="72" width="56" height="10" rx="3" fill="#c98d4b"/></svg>`,
apple:`<svg viewBox="0 0 100 100"><circle cx="50" cy="58" r="26" fill="#e05252"/><path d="M50 32 q4 -10 14 -12" stroke="#7a4a21" stroke-width="4" fill="none"/><ellipse cx="66" cy="26" rx="10" ry="6" fill="#58a05c" transform="rotate(-25 66 26)"/><ellipse cx="42" cy="52" rx="6" ry="9" fill="#f08383" opacity=".7"/></svg>`,
banana:`<svg viewBox="0 0 100 100"><path d="M20 30 Q55 35 78 70 Q60 62 35 55 Q22 50 20 30" fill="#f5d547" stroke="#d9b93a" stroke-width="2"/><rect x="16" y="24" width="10" height="10" rx="3" fill="#8a6a3b" transform="rotate(-20 21 29)"/></svg>`,
bread:`<svg viewBox="0 0 100 100"><rect x="20" y="40" width="60" height="34" rx="16" fill="#d99a55"/><rect x="20" y="58" width="60" height="16" rx="8" fill="#c07f3e"/><path d="M35 48 l6 6 M50 48 l6 6 M65 48 l6 6" stroke="#a86a2f" stroke-width="3"/></svg>`,
rice:`<svg viewBox="0 0 100 100"><rect x="32" y="28" width="36" height="52" rx="6" fill="#f3ead8" stroke="#d5c49c"/><rect x="32" y="28" width="36" height="12" rx="6" fill="#d5c49c"/><text x="50" y="58" font-size="12" text-anchor="middle" fill="#8a7a55" font-weight="bold">RICE</text><text x="50" y="72" font-size="9" text-anchor="middle" fill="#8a7a55">5 lb</text></svg>`,
soysauce:`<svg viewBox="0 0 100 100"><rect x="42" y="12" width="16" height="14" rx="3" fill="#b03a2e"/><rect x="38" y="26" width="24" height="10" fill="#7a2a20"/><path d="M38 36 h24 l6 14 v30 a6 6 0 0 1 -6 6 h-24 a6 6 0 0 1 -6 -6 v-30 z" fill="#5c1f16"/><rect x="38" y="52" width="24" height="16" fill="#f3ead8"/><text x="50" y="64" font-size="8" text-anchor="middle" fill="#5c1f16" font-weight="bold">SOY</text></svg>`,
yogurt:`<svg viewBox="0 0 100 100"><path d="M30 35 h40 l-5 45 a6 6 0 0 1 -6 5 h-18 a6 6 0 0 1 -6 -5 z" fill="#7fb6e8"/><rect x="28" y="28" width="44" height="10" rx="4" fill="#4a90d9"/><ellipse cx="50" cy="35" rx="20" ry="5" fill="#fff"/><text x="50" y="62" font-size="10" text-anchor="middle" fill="#fff" font-weight="bold">YOGURT</text></svg>`
};

const PRODUCTS = [
  {id:1, name:"Whole Milk, 1 gal",   cat:"Dairy",   price:4.29, unit:"each", art:"milk"},
  {id:2, name:"Large Eggs, 12 ct",   cat:"Dairy",   price:3.99, unit:"each", art:"eggs"},
  {id:3, name:"Greek Yogurt, 32 oz",  cat:"Dairy",   price:5.49, unit:"each", art:"yogurt"},
  {id:4, name:"Red Apples",           cat:"Produce", price:1.99, unit:"per lb", art:"apple"},
  {id:5, name:"Bananas",              cat:"Produce", price:0.69, unit:"per lb", art:"banana"},
  {id:6, name:"White Sandwich Bread", cat:"Bakery",  price:2.49, unit:"each", art:"bread"},
  {id:7, name:"Long-Grain Rice, 5 lb",cat:"Pantry",  price:6.99, unit:"each", art:"rice"},
  {id:8, name:"Soy Sauce, 15 oz",     cat:"Pantry",  price:3.49, unit:"each", art:"soysauce"},
];
const CATS = ["All","Dairy","Produce","Bakery","Pantry"];

let activeCat = "All", query = "", cart = {};
try { cart = JSON.parse(localStorage.getItem("ts_cart")||"{}"); } catch(e){ cart = {}; }
function saveCart(){ try{ localStorage.setItem("ts_cart", JSON.stringify(cart)); }catch(e){} }

/* ---------- render ---------- */
function renderCats(){
  document.getElementById("cats").innerHTML = CATS.map(c =>
    `<button class="${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");
}
function setCat(c){ activeCat = c; renderCats(); renderGrid(); }
function applySearch(){ query = document.getElementById("search").value.trim().toLowerCase(); renderGrid(); }
document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderGrid(); });

function renderGrid(){
  const list = PRODUCTS.filter(p =>
    (activeCat==="All" || p.cat===activeCat) &&
    (!query || p.name.toLowerCase().includes(query)));
  const g = document.getElementById("grid");
  g.innerHTML = list.length ? list.map(p => `
    <div class="card">
      <div class="img">${ART[p.art]}</div>
      <div class="body">
        <div class="cat">${p.cat}</div>
        <h3>${p.name}</h3>
        <div class="price">$${p.price.toFixed(2)} <small>${p.unit}</small></div>
        <div class="qty">
          <button onclick="chQty(${p.id},-1)" aria-label="decrease">â</button>
          <span id="q${p.id}">${cart[p.id]||0}</span>
          <button onclick="chQty(${p.id},1)" aria-label="increase">+</button>
        </div>
        <button class="add" onclick="addToCart(${p.id})">Add to Basket</button>
      </div>
    </div>`).join("")
    : `<div class="empty">No products match. Try another search or category.</div>`;
}
function chQty(id,d){
  const el = document.getElementById("q"+id);
  let q = (cart[id]||0) + d;
  if(q < 0) q = 0;
  if(q === 0) delete cart[id]; else cart[id] = q;
  if(el) el.textContent = q;
  saveCart(); renderCart();
}
function addToCart(id){
  cart[id] = (cart[id]||0) + 1;
  const el = document.getElementById("q"+id);
  if(el) el.textContent = cart[id];
  saveCart(); renderCart(); openCart();
}

/* ---------- basket drawer ---------- */
function cartTotals(){
  let n=0, amt=0;
  for(const [id,q] of Object.entries(cart)){
    const p = PRODUCTS.find(x=>x.id==id);
    if(p){ n+=q; amt+=p.price*q; }
  }
  return {n, amt};
}
function renderCart(){
  const box = document.getElementById("cartItems");
  const ids = Object.keys(cart);
  box.innerHTML = ids.length ? ids.map(id => {
    const p = PRODUCTS.find(x=>x.id==id), q = cart[id];
    return `<div class="ci">
      <div class="thumb">${ART[p.art]}</div>
      <div class="info"><b>${p.name}</b><span>$${p.price.toFixed(2)} ${p.unit}</span>
        <div class="row">
          <button onclick="chQty(${p.id},-1)">â</button><span>${q}</span>
          <button onclick="chQty(${p.id},1)">+</button>
        </div></div>
      <div class="amt">$${(p.price*q).toFixed(2)}</div>
    </div>`;
  }).join("") : `<div class="empty">Your basket is empty.</div>`;
  const t = cartTotals();
  document.getElementById("subAmt").textContent = "$"+t.amt.toFixed(2);
  document.getElementById("cartCount").textContent = t.n;
}
function openCart(){ document.getElementById("drawer").classList.add("open"); document.getElementById("overlay").classList.add("show"); }
function closeCart(){ document.getElementById("drawer").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); }
function checkout(){
  const t = cartTotals();
  if(!t.n){ alert("Your basket is empty."); return; }
  alert("Demo checkout â "+t.n+" item(s), $"+t.amt.toFixed(2)+".\nTo take real payments, connect Stripe (we can set that up when you are ready).");
}

/* ---------- theme ---------- */
function toggleTheme(){
  const h = document.documentElement;
  h.dataset.theme = h.dataset.theme==="dark" ? "" : "dark";
  try{ localStorage.setItem("ts_theme", h.dataset.theme); }catch(e){}
}
try{ if(localStorage.getItem("ts_theme")==="dark") document.documentElement.dataset.theme="dark"; }catch(e){}

renderCats(); renderGrid(); renderCart();
</script>
</body>
</html>
